<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>潮汐书 · 双端预览</title>
<style>
  html,body{margin:0;background:#141514;color:#8a857c;font-family:Consolas,monospace}
  .wrap{display:flex;gap:36px;padding:24px 30px;align-items:flex-start}
  figure{margin:0}
  figcaption{margin-top:10px;font-size:10px;letter-spacing:.18em;color:#6f6a62}
  .phone{width:312px;height:675px;overflow:hidden;background:#03100f;border:1px solid #2a2b28}
  .phone iframe{width:390px;height:844px;border:0;transform:scale(.8);transform-origin:0 0}
  .desk{width:720px;height:450px;overflow:hidden;background:#03100f;border:1px solid #2a2b28}
  .desk iframe{width:1440px;height:900px;border:0;transform:scale(.5);transform-origin:0 0}
</style>
</head>
<body>
  <div class="wrap">
    <figure>
      <div class="phone"><iframe title="mobile"></iframe></div>
      <figcaption>390 × 844 / MOBILE</figcaption>
    </figure>
    <figure>
      <div class="desk"><iframe title="desktop"></iframe></div>
      <figcaption>1440 × 900 / DESKTOP</figcaption>
    </figure>
  </div>
  <script>
    var q = new URLSearchParams(location.search);
    var p = q.get('p') || '0.46';
    var dbg = q.get('debug') ? '&debug=1' : '';
    var src = 'index.html?p=' + p + dbg;
    document.querySelectorAll('iframe').forEach(function (f) { f.src = src; });
  </script>
</body>
</html>

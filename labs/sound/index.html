<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03100F">
<title>声音 lab · 潮汐书 · 海南</title>
<link rel="stylesheet" href="lab.css">
</head>
<body>

  <canvas id="scope" aria-hidden="true"></canvas>

  <div class="ui">

    <header>
      <div class="brand">
        <span class="seal" aria-hidden="true">潮</span>
        <span>潮汐书 · 声音 lab<br><em>SOUND LAB / NOT THE PAGE</em></span>
      </div>
      <button class="mute" id="mute" type="button" aria-pressed="false" aria-label="开启声音">
        <span class="dot" aria-hidden="true"></span>
        <span>声音</span>
        <b id="muteState">OFF</b>
      </button>
    </header>

    <div class="spacer"></div>

    <section class="panel" aria-label="声音 lab 控制">

      <div class="acts" id="acts" role="group" aria-label="幕"></div>

      <label class="tide" for="tide">
        <span>潮位 TIDE</span>
        <input id="tide" type="range" min="0" max="1000" value="40" aria-label="潮位">
        <output id="tideOut" for="tide">0.040</output>
      </label>

      <div class="events" role="group" aria-label="交互事件">
        <button type="button" data-ev="warm" id="warm">按住升温</button>
        <button type="button" data-ev="pick">拾字</button>
        <button type="button" data-ev="light">停光 2s</button>
        <button type="button" data-ev="trace">划一笔</button>
        <button type="button" data-ev="stamp">收下</button>
      </div>

      <pre id="status" aria-live="polite">尚未解锁 · 点一下页面</pre>

      <p class="note">
        原型：5 幕 bed + 水线 wet/dry + 交叉淡化 + 静音记忆。全部程序化合成，无音频文件。
        不是正式页，不接 M0 的 <code>js/audio.js</code>。
      </p>

    </section>

  </div>

  <script src="sound.js"></script>
</body>
</html>
